services:
  home:
    container_name: home-prod
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${HOME_HOST_PORT:-3000}:3000"
    networks:
      - monitoring-shared

networks:
  monitoring-shared:
    name: ${MONITORING_SHARED_NETWORK:-monitoring-shared}
    external: true
